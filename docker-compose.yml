# Navis backend — the COMPLETE runtime.
#
# The image's default CMD starts the API only. Running just that ships a product
# where Gmail never becomes memory: the API writes signals and staged outbox
# pointers, and nothing ever relays them. That is not hypothetical — it is the
# outage this deployment exists to prevent (495 unpublished signal_outbox rows
# and a 2-day-13-hour memory lag, because no worker was running).
#
# Three processes are REQUIRED for the pipeline to function:
#   api     — HTTP surface
#   worker  — executes tasks: outbox relay (signals -> memory), embedding,
#             execution, importance backfill
#   beat    — the clock: schedules sync, relays, watch renewal, daily briefs
#
# `restart: unless-stopped` on each is the point. A worker that dies silently
# stalls the whole product with a healthy-looking API in front of it.
#
#   docker compose up -d
#   docker compose logs -f worker

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: navis
      POSTGRES_PASSWORD: navis
      POSTGRES_DB: navis
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navis"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Broker (db 2) + results (db 3) + cache/events (db 0) live here. AOF so a
    # restart does not drop queued tasks that acks_late has not yet confirmed.
    # Listens on 6380 (not Redis's default 6379) so container-internal and
    # host-facing addresses match — one port everywhere, no translation.
    command: ["redis-server", "--port", "6380", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6380:6380"

  api:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Compose networking: override the host-facing values from .env.
      DATABASE_URL: postgresql://navis:navis@db:5432/navis
      REDIS_URL: redis://redis:6380/0
      CELERY_BROKER_URL: redis://redis:6380/2
      CELERY_RESULT_BACKEND: redis://redis:6380/3
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "8000:8000"
    healthcheck:
      # /ready checks Postgres + Redis; /health would pass while dependencies are down.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://navis:navis@db:5432/navis
      REDIS_URL: redis://redis:6380/0
      CELERY_BROKER_URL: redis://redis:6380/2
      CELERY_RESULT_BACKEND: redis://redis:6380/3
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    # --pool=prefork is REQUIRED. `run_async` keeps ONE event loop per process for
    # the lifetime of the worker (asyncpg pools bind to the loop that created
    # them), so a THREAD pool would drive one loop from several threads and
    # corrupt it. Prefork gives concurrency via separate processes, each with its
    # own loop — safe. Never switch this to --pool=threads/gevent/eventlet.
    command:
      - celery
      - -A
      - navis.platform.queue.celery_app:celery_app
      - worker
      - --pool=prefork
      - --concurrency=2
      - --loglevel=INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A navis.platform.queue.celery_app:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  beat:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://navis:navis@db:5432/navis
      REDIS_URL: redis://redis:6380/0
      CELERY_BROKER_URL: redis://redis:6380/2
      CELERY_RESULT_BACKEND: redis://redis:6380/3
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    # EXACTLY ONE beat instance, ever. Two schedulers double-fire every task;
    # the relays are idempotent so it would not corrupt data, but it doubles
    # Gmail API and Azure spend for nothing. Do not `--scale beat=N`.
    command:
      - celery
      - -A
      - navis.platform.queue.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    volumes:
      - beat-schedule:/tmp

volumes:
  db-data:
  redis-data:
  beat-schedule:
