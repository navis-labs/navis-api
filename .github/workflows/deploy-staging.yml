name: Deploy staging

# development branch IS staging. Every merge into it goes out automatically —
# no approval, no manual step. That is the point of a staging environment: it
# should always hold the next release candidate, so problems surface here.

on:
  push:
    branches: [development]
  workflow_dispatch: # manual re-deploy / rollback of an older commit

permissions:
  contents: read
  id-token: write

jobs:
  # Merged code is tested here, once, before anything is built or deployed.
  # ci.yml has no `push` trigger precisely so this is the only run on merge.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      # Real values from the staging account, built 2026-09-22. They are also
      # recorded in docs/DEPLOYMENT.md under "Recorded values". Two of the
      # service names carry a random suffix because the ECS console generated
      # them; that suffix is part of the name and cannot be dropped.
      aws-region: ap-southeast-1
      ecr-repository: navis-api-staging
      ecs-cluster: navis-staging
      api-service: navis-api-staging-api-service
      worker-service: navis-api-staging-worker-service-i49pghsm
      beat-service: navis-api-staging-beat-service-hpdb0ws2
      migration-subnets: subnet-0a5bd7ad312ef9acd,subnet-05fc7cbb8c61349d0
      migration-security-groups: sg-058b623824f3bcec9
      # Staging runs in PUBLIC subnets, deliberately: a NAT gateway costs about
      # $35/month and staging does not need the isolation production does.
      # Public subnets have no NAT, so the task needs its own public IP to reach
      # ECR at all. Production keeps the default (DISABLED) with a NAT gateway.
      assign-public-ip: ENABLED
